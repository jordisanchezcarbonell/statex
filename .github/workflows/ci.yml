# Comprobaciones en cada push y pull request: secretos, dependencias, tipos, build, cabeceras y Lighthouse.
# Acciones fijadas por SHA (con la versión en comentario) para no depender de etiquetas mutables.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # todo el historial: una clave borrada sigue filtrada si está en un commit

      # Binario oficial verificado por SHA-256 (sin acciones de terceros).
      - name: Instalar gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks

      - name: Buscar secretos en el historial
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  calidad:
    name: Tipos, build y Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Se mide como quedará al lanzar (indexable), para que la auditoría SEO sea significativa.
      # Solo afecta a este build de CI, no a Vercel.
      SITE_INDEXABLE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Caché de Next.js: guarda las fuentes de next/font/google ya descargadas (el design lab usa
      # muchas familias) y acelera el build.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*.ts', 'app/**/*.tsx', 'app/**/*.css') }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-

      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck

      # next/font descarga las fuentes de Google en el build; un fallo puntual de red tumbaba el job
      # (run 41234365646). Un único reintento tras 20 s; si vuelve a fallar, es un error real.
      - name: Build
        run: npm run build || { echo "::warning::Build fallido; reintento en 20 s"; sleep 20; npm run build; }

      # Cabeceras de seguridad de next.config.ts (CSP, nosniff, X-Frame-Options...) y noindex en rutas internas.
      - name: Cabeceras de seguridad
        run: |
          npm run start -- -p 3200 > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3200/ && break; sleep 1; done
          node scripts/check-headers.mjs http://localhost:3200
          kill %1

      # Umbrales en lighthouserc.json: rendimiento, accesibilidad, buenas prácticas y SEO fallan por debajo de 90/95/95/95.
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Informes de Lighthouse
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 14
