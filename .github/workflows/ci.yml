# Comprobaciones de calidad en cada push y pull request: tipos, build y Lighthouse.
# Acciones fijadas por SHA (con la versión en comentario) para no depender de etiquetas mutables.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Tipos, build y Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Se mide como quedará al lanzar (indexable), para que la auditoría SEO sea significativa.
      # Solo afecta a este build de CI, no a Vercel.
      SITE_INDEXABLE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run build

      # Umbrales en lighthouserc.json: rendimiento avisa (<90); accesibilidad, buenas prácticas y SEO fallan (<95).
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Informes de Lighthouse
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 14
